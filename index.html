<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitanova Voyages</title>
<meta name="description" content="Vitanova Voyages test page. The site at vitanovavoyages.com is online.">
<style>
  :root {
    --ink: #f6f1e8;
    --sea: #d7c4a2;
    --gold: #e2c48a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
      linear-gradient(180deg, rgba(6, 10, 18, 0.22), rgba(6, 10, 18, 0.38)),
      url("vita-nova.jpg") center center / cover no-repeat;
    background-color: #070b12;
  }
  main {
    width: min(36rem, 100%);
    min-width: 0;
    max-width: 100%;
    text-align: center;
    padding: 2rem 1.5rem;
    background: rgba(8, 12, 20, 0.46);
    border: 1px solid rgba(246, 241, 232, 0.16);
    backdrop-filter: blur(8px);
  }
  .kicker {
    font: 600 .78rem/1 system-ui, sans-serif;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--sea);
  }
  h1 {
    margin: .7rem 0 .85rem;
    font-size: clamp(1.85rem, 6.2vw, 4.1rem);
    max-width: 100%;
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: .95;
    overflow-wrap: break-word;
  }
  @media (max-width: 480px) {
    body { padding: 1.25rem .9rem; }
    main { padding: 1.4rem 1rem; }
    h1 { font-size: clamp(1.7rem, 8vw, 2.35rem); }
  }
  .rule {
    width: 3.5rem;
    height: 2px;
    margin: 0 auto 1.25rem;
    background: var(--gold);
  }
  .lead {
    font-size: clamp(1.05rem, 3vw, 1.25rem);
    line-height: 1.5;
  }
  .meta {
    margin-top: 2rem;
    font: .9rem/1.4 system-ui, sans-serif;
    color: #d9d0c4;
  }
</style>
</head>
<body>
<main>
  <p class="kicker">Test page</p>
  <h1>Vitanova Voyages</h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="lead">This is a placeholder. The site is online and ready for the real pages.</p>
  <p class="meta">vitanovavoyages.com</p>
</main>
</body>
</html>
